
random_seed: 42

data:
  csv: data/annotated/annotated_interaction_test.csv

  mask_dir: log/mask_cache

  mask_channels: false
  gap_scale_px: 15.0

  video_dir: "/user/work/sf24225/data/Full_behav/Videos to process batch 1 - social contacts"
  pair_iou_low: 0.1
  pair_iou_high: 0.8
  sample_fps: 1.0
  sam3_conf: 0.6

labels:
  no_interaction_names: [no_interaction, none, no, "0"]
  exclude_names: ["not well-cropped"]
  exclude_positive_v2: []

depth:
  cache_dir: log/depth_cache
  encoder: vitl
  tol: 0.05

region:
  dilate_px: 15
  min_area_px: 64

pose:
  hrnet_ckpt: checkpoints/hrnet_w32_ap10k_256x256-18aac840_20211029.pth
  num_joints: 17
  input_size: 256
  hmap_size: 64
  use_in_model: false
  cache_dir: log/pose_cache
  radius_px: 18
  proximity_px: 60
  pool_topk: 3

  prior:
    enabled: false
    weight: 0.15
    sigma_scale: 0.5
    sigma_min_px: 12
    sigma_max_px: 45
    conf_weighting: true
  min_conf: 0.3

model:
  image_size: 224
  backbone: timm
  timm_name: vit_base_patch16_224
  dinov2_name: dinov2_vitl14
  action_ckpt: checkpoints/action.ckpt
  freeze_blocks: 8
  pooling: topk
  topk_frac: 0.05
  tau_start: 1.0
  tau_end: 3.0

loss:
  lambda_sparsity: 0.01
  lambda_tv: 0.3
  auto_pos_weight: true

train:
  epochs: 20
  batch_size: 16
  lr_backbone: 0.000005
  lr_head: 0.0001
  weight_decay: 0.05
  num_workers: 8
  amp: true
  hflip_prob: 0.5

output:
  run_dir: log/contact
  ckpt_name: contact_mil.pt
  vis_dir: log/contact/vis
  diag_dir: log/diagnostics
