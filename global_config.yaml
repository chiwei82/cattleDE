# Global configuration shared by the prep scripts (prep/*.py).
# Each script loads this file from the repository root.

# ── Shared ─────────────────────────────────────────────────────────────────────
random_seed: 42

# train:val:test = 6:2:2
split:
  val_ratio: 0.2
  test_ratio: 0.2

paths:
  annotated_dir: data/annotated   # annotated_{action,interaction}.csv live here
  data_root: /user/work/sf24225/data/Full_behav/Marco
  clips_dir: /user/work/sf24225/data/Full_behav/Marco/clips
  hrnet_ckpt: checkpoints/hrnet_w32_ap10k_256x256-18aac840_20211029.pth
  yolo_ckpt: checkpoints/yolo_pseudo.pt  # retrained on pseudo-labels (fixes confidence suppression)
  action_ckpt: checkpoints/action.ckpt        # produced by train/action_with_image.py
  interaction_ckpt: checkpoints/interaction.ckpt  # produced by train/interaction_with_image.py

# ── Action classification training (train/action_with_image.py) ───────────────
# Image-only (no pose). Reads data/annotated/annotated_action.csv; the split is
# read from the train/val/test folder in each image path (6:2:2 from action_prep).
action_train:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  image_size: 224
  num_workers: 8
  run_dir: log/action

# ── Interaction classification training (train/interaction_with_image.py) ─────
# Image-only, BINARY (no_interaction vs interaction). The ViT backbone is
# initialised from the action checkpoint (paths.action_ckpt) so the interaction
# model reuses the action latent space. Split read from the CSV 'split' column.
# NOTE: needs labelled data — annotated_interaction.csv label columns are blank
# until human annotation, so this step stays disabled in main_task.sh for now.
interaction_train:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  image_size: 224
  num_workers: 8
  fusion_type: attention      # 'attention' or 'mlp'
  pooling_type: gap           # flatten | gmp | gap | gap_gmp
  freeze_backbone: false
  pretrained_backbone: true   # init ViT from paths.action_ckpt
  run_dir: log/interaction
  # binary label rule on label_v1:
  #   in no_interaction_names -> 0 ; in exclude_names (or blank) -> dropped ; else -> 1
  no_interaction_names: [no_interaction, none, no, "0"]
  exclude_names: ["not well-cropped"]   # bad crops — excluded from training

# ── YOLO OBB training (main_task.sh) ──────────────────────────────────────────
yolo_train:
  model: yolo11n-obb.pt   # base model to fine-tune
  epochs: 50
  imgsz: 1280
  run_dir: log/yolo       # ultralytics run output (relative to repo root)
  run_name: obb_train

# ── Pose visualization (prep/pose_vis.py) ─────────────────────────────────────
pose_vis:
  num_samples: 20
  conf_kp: 0.3            # min keypoint confidence to draw

# ── YOLO OBB dataset prep (prep/yolo_prep.py) ─────────────────────────────────
yolo_prep:
  output_dir: data/object
  frame_step: 16
  camera_dirs: [camera128, camera133, camera26, camera27, camera48]

# ── Pseudo-labeling with an independent COCO model (prep/pseudo_label.py) ──────
# Auto-fills missing cattle labels using an off-the-shelf COCO detector — NO
# manual annotation. Applied to ALL splits so the model can be RETRAINED on the
# corrected labels (fixes the confidence-suppression caused by missing labels).
# Output is a pseudo-label set, not human-verified ground truth: COCO boxes are
# axis-aligned, so added labels lose orientation — a known trade-off for OBB.
pseudo_label:
  splits: [train, val, test]  # must include train and val (ultralytics needs both)
  model: yolo11x.pt       # COCO-pretrained detector (auto-downloads)
  coco_cow_class: 19      # "cow" class id in COCO
  conf: 0.25              # COCO detection confidence threshold
  imgsz: 1280
  iou_match_thresh: 0.3   # a COCO box with max IoU < this vs existing labels
                          # counts as a missing cow and gets added
  pseudo_suffix: _pseudo  # output dataset dir = <output_dir><suffix>
  run_name: obb_pseudo    # ultralytics run name for the retrain
  ckpt_out: checkpoints/yolo_pseudo.pt  # where the retrained best.pt is published

# ── Interaction dataset prep (prep/interaction_prep.py) ───────────────────────
interaction_prep:
  video_dir: "/user/work/sf24225/data/Full_behav/Videos to process batch 1 - social contacts"
  output_dir: data/interaction
  use_pose: false         # false = skip HRNet entirely; pose columns stay empty
  sample_fps: 1.0
  iou_low: 0.1
  iou_high: 0.8
  yolo_conf: 0.3 # based on best f1-score
  yolo_imgsz: 1280
  nested_thresh: 0.85

# ── Action dataset prep (prep/action_prep.py) ─────────────────────────────────
action_prep:
  output_dir: data/action
  use_pose: false         # false = skip HRNet entirely; pose_path stays empty
  sample_every: 8         # 1 frame every N frames (16 fps clips -> 2 fps)
  pose_batch: 32          # HRNet inference batch size
  labels: [standing, stepping, walking, lying, transitiondown, transitionup, sniffingbed]

# ── HRNet constants ────────────────────────────────────────────────────────────
hrnet:
  num_joints: 17
  input_size: 256
  hmap_size: 64
