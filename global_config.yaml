# Global configuration shared by the prep scripts (prep/*.py).
# Each script loads this file from the repository root.

# ── Shared ─────────────────────────────────────────────────────────────────────
random_seed: 42

# train:val:test = 6:2:2
split:
  val_ratio: 0.2
  test_ratio: 0.2

paths:
  annotated_dir: data/annotated   # annotated_{action,interaction}.csv live here
  data_root: /user/work/sf24225/data/Full_behav/Marco
  clips_dir: /user/work/sf24225/data/Full_behav/Marco/clips
  hrnet_ckpt: checkpoints/AK_hrnet_final.pth  # HRNet-W32 trained on Animal Kingdom (23 kpts)
  yolo_ckpt: checkpoints/yolo_pseudo.pt  # retrained on pseudo-labels (fixes confidence suppression)
  action_ckpt: checkpoints/action.ckpt        # produced by train/action_with_image.py
  interaction_ckpt: checkpoints/interaction.ckpt  # produced by train/interaction_with_image.py

# ── Action metric-learning training (train/action_with_image.py) ─────────────
# Image-only (no pose). Trains a ViT-B/16 encoder with a triplet loss + a
# zero-mean latent regularization to build a discriminative action embedding,
# which the interaction model reuses as its ViT backbone. Reads
# data/annotated/annotated_action.csv; split from the train/val/test folder in
# each image path. Settings follow reproduction/CattleAct/metric.
action_train:
  epochs: 50
  learning_rate: 0.00001      # 1e-5
  image_size: 224
  num_workers: 8
  run_dir: log/action
  embedding_size: 256         # ViT head output dim (the embedding)
  margin: 0.5                 # triplet loss margin
  reg_loss_weight: 0.1        # weight of the zero-mean latent regularization
  sigma_s_squared: 10.0       # latent variance in the regularization term
  classes_per_batch: 3        # BalancedBatchSampler: classes per batch
  samples_per_class: 4        # samples per class  (batch size = 3 * 4 = 12)
  # Train augmentation (image-only), values from reproduction/CattleAct/metric.
  # Skeleton masking is replaced by RandomErasing (no pose in this pipeline).
  randaug_num_ops: 3
  randaug_magnitude: 7
  cutout_prob: 0.5            # per-erasing probability
  cutout_n_holes: 3          # number of RandomErasing passes
  cutout_scale: [0.02, 0.1]  # erased area fraction range
  cutout_ratio: [0.5, 3.0]   # erased region aspect-ratio range

# ── Interaction classification training (train/interaction_with_image.py) ─────
# Image-only, BINARY (no_interaction vs interaction). The ViT backbone is
# initialised from the action checkpoint (paths.action_ckpt) so the interaction
# model reuses the action latent space. Split read from the CSV 'split' column.
# NOTE: needs labelled data — annotated_interaction.csv label columns are blank
# until human annotation, so this step stays disabled in main_task.sh for now.
interaction_train:
  epochs: 100                  # reproduction: max_epochs 100
  batch_size: 32
  learning_rate: 0.0001
  image_size: 224
  num_workers: 8
  fusion_type: attention      # 'attention' or 'mlp'
  pooling_type: flatten       # flatten | gmp | gap | gap_gmp (reproduction: flatten)
  freeze_backbone: false
  pretrained_backbone: true   # init ViT from paths.action_ckpt
  run_dir: log/interaction
  # binary label rule on label_v1:
  #   in no_interaction_names -> 0 ; in exclude_names (or blank) -> dropped ; else -> 1
  no_interaction_names: [no_interaction, none, no, "0"]
  exclude_names: ["not well-cropped"]   # bad crops — excluded from training
  # Loss (output stays BINARY). main_loss shapes the classifier; pre_fusion_loss
  # (InfoNCE) aligns the interaction/context feature with its constituent cattle
  # (action) features before fusion. Values follow reproduction/CattleAct.
  # Training-set resampling for the class imbalance:
  #   weighted       -> WeightedRandomSampler, balance to 50/50 in a fixed budget
  #                     (drops ~half the negatives, repeats positives ~n0/n1 x)
  #   oversample_pos -> keep ALL negatives once, repeat each positive oversample_factor
  #                     times (null = repeat to match the negative count)
  sampler: weighted
  oversample_factor: null
  main_loss: ldam                # cross_entropy | focal | ldam
  ldam_max_m: 0.5
  ldam_s: 30.0
  pre_fusion_loss: infonce       # none | triplet | infonce
  pre_fusion_temperature: 0.07   # InfoNCE temperature
  pre_fusion_margin: 0.2         # (used only when pre_fusion_loss = triplet)
  pre_fusion_weight: 0.1         # weight of the pre-fusion loss
  # Skeleton-aware Cutout on the training crops (needs HRNet poses in the CSV,
  # i.e. interaction_prep run with use_pose: true). Masks around the interaction-
  # defining joints (head/neck/torso) using the AK 23-keypoint joint map.
  skeleton_aug:                # values follow reproduction masking_from_skeleton
    use: true
    cutout_prob: 1.0
    n_holes: 5
    scale: [0.02, 0.1]
    ratio: [0.5, 3.0]
    margin: 10

# ── YOLO OBB training (main_task.sh) ──────────────────────────────────────────
yolo_train:
  model: yolo11n-obb.pt   # base model to fine-tune
  epochs: 50
  imgsz: 1280
  run_dir: log/yolo       # ultralytics run output (relative to repo root)
  run_name: obb_train

# ── Pose visualization (prep/pose_vis.py) ─────────────────────────────────────
pose_vis:
  num_samples: 20
  conf_kp: 0.3            # min keypoint confidence to draw

# ── YOLO OBB dataset prep (prep/yolo_prep.py) ─────────────────────────────────
yolo_prep:
  output_dir: data/object
  frame_step: 16
  camera_dirs: [camera128, camera133, camera26, camera27, camera48]

# ── Pseudo-labeling with an independent COCO model (prep/pseudo_label.py) ──────
# Auto-fills missing cattle labels using an off-the-shelf COCO detector — NO
# manual annotation. Applied to ALL splits so the model can be RETRAINED on the
# corrected labels (fixes the confidence-suppression caused by missing labels).
# Output is a pseudo-label set, not human-verified ground truth: COCO boxes are
# axis-aligned, so added labels lose orientation — a known trade-off for OBB.
pseudo_label:
  splits: [train, val, test]  # must include train and val (ultralytics needs both)
  model: yolo11x.pt       # COCO-pretrained detector (auto-downloads)
  coco_cow_class: 19      # "cow" class id in COCO
  conf: 0.25              # COCO detection confidence threshold
  imgsz: 1280
  iou_match_thresh: 0.3   # a COCO box with max IoU < this vs existing labels
                          # counts as a missing cow and gets added
  pseudo_suffix: _pseudo  # output dataset dir = <output_dir><suffix>
  run_name: obb_pseudo    # ultralytics run name for the retrain
  ckpt_out: checkpoints/yolo_pseudo.pt  # where the retrained best.pt is published

# ── Interaction dataset prep (prep/interaction_prep.py) ───────────────────────
interaction_prep:
  video_dir: "/user/work/sf24225/data/Full_behav/Videos to process batch 1 - social contacts"
  output_dir: data/interaction
  use_pose: true          # run HRNet (AK 23-kpt) and fill pose_path_1/2 in the CSV
  sample_fps: 1.0
  iou_low: 0.1
  iou_high: 0.8
  yolo_conf: 0.6 # based on best f1-score
  yolo_imgsz: 1280
  nested_thresh: 0.85

# ── Action dataset prep (prep/action_prep.py) ─────────────────────────────────
action_prep:
  output_dir: data/action
  use_pose: false         # false = skip HRNet entirely; pose_path stays empty
  sample_every: 8         # 1 frame every N frames (16 fps clips -> 2 fps)
  pose_batch: 32          # HRNet inference batch size
  labels: [standing, stepping, walking, lying, transitiondown, transitionup, sniffingbed]

# ── HRNet constants ────────────────────────────────────────────────────────────
hrnet:
  num_joints: 23         # Animal Kingdom keypoint count (was 17 for AP-10K)
  input_size: 256
  hmap_size: 64
